[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/Evelynkaz/DDNet-AI"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }

# Shared lint policy for every crate in the workspace. Member crates opt in with
# `[lints] workspace = true`. Kept strict from the start: this CI gates every later task.
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"

# Physics parity tests (later phases) must be bit-exact with the C++ reference, so nothing here
# may change float semantics: no `target-cpu` (see rust-toolchain.toml / no .cargo/config.toml)
# and no fast-math. `lto`/`codegen-units`/`debug` below only affect codegen strategy and
# debuginfo, not the value any floating-point operation produces, so they are free to tune for
# release binary size/speed. `[profile.dev]` bumps our own crates to opt-level 1 (debug builds
# would otherwise be too slow for the heavy physics-parity tests) while keeping dependency code
# at opt-level 3 via `[profile.dev.package."*"]`, since deps rarely need to be stepped through.
[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# `cargo bench` uses a separate `bench` profile that, unlike `test`/`dev`, does NOT automatically
# inherit `[profile.release]`'s custom `lto`/`codegen-units` (only its opt-level-3 default) unless
# told to — needed for ddai-physics's criterion benches (task 1.3) to measure the same
# cross-function-inlined codegen the actual `--release` build (and every real caller) gets.
[profile.bench]
inherits = "release"

# ddai-jsmath needs real inlining+constant-folding even in `cargo test`'s dev profile (opt-level
# 1 from `[profile.dev]` above): its `pow` regression test (task 3.1a review F9) only reproduces
# the bug it guards against — LLVM rewriting `f64::powf` for a constant operand it can see through
# after inlining — when the compiler actually inlines and folds, which opt-level 1 doesn't do. This
# does not weaken the physics-parity guarantee the comment above protects (no `target-cpu`, no
# fast-math): `opt-level` alone never changes what value a floating-point operation produces,
# only which optimizations (dead code, inlining, constant folding) run — the property this crate's
# entire test suite exists to check.
[profile.dev.package.ddai-jsmath]
opt-level = 3

# ddai-fly's batched training kernels (task 7.2b) rest on a few loops the compiler must turn into
# SIMD code (no `unsafe`, no intrinsics), and `batched::kernels::vectorisation_guard` times them
# against scalar reductions to catch a silent loss of that (task 7.2c: runs in plain `cargo test`
# and so in CI). The loop vectoriser does not run at opt-level 1, so this crate is built at
# opt-level 3 in the dev/test profile too (it also makes ddai-fly's own heavy tests several times
# faster). As with ddai-jsmath above, `opt-level` never changes the value a floating-point
# operation produces, so nothing the physics-parity guarantees (D-002/D-004) rest on moves.
[profile.dev.package.ddai-fly]
opt-level = 3
