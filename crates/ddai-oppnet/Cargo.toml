[package]
name = "ddai-oppnet"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Task 3.15 (E-028): a small learned predictor of the opponent's inputs for the hybrid's input-lag window -- snapshot-observable features, an allocation-free MLP with a hand-written backward and a fixed summation order, the trainer, the dataset format and the model bundle."

[lib]
name = "ddai_oppnet"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
ddai-brain = { path = "../ddai-brain" }
ddai-jsmath = { path = "../ddai-jsmath" }
ddai-physics = { path = "../ddai-physics" }
ddai-planner = { path = "../ddai-planner" }
rayon = "1.10"
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
zstd = "0.14.0"
sha2 = "0.10"
serde_json = "1"

[dev-dependencies]
allocation-counter = "0.8.1"
ddai-clip = { path = "../ddai-clip" }
ddai-map = { path = "../ddai-map" }
# `examples/human_games.rs` (task 3.24): demos -> games of real humans.
ddai-dataset = { path = "../ddai-dataset" }
ddai-demo = { path = "../ddai-demo" }
ddai-recorder = { path = "../ddai-recorder" }
ddai-world = { path = "../ddai-world" }
# `examples/human_arena.rs` (task 3.24): the arena with the behaviour-cloning proposer.
ddai-env = { path = "../ddai-env" }
tempfile = "3.14"
