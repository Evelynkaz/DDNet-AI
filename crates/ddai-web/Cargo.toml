[package]
name = "ddai-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The bot's own web server: axum + WebSocket over loopback only, password login (argon2id), server-side sessions, CSRF/Origin checks, security headers, and a minimal login + status page. Task 5.1 skeleton; the game view comes later."

[lib]
name = "ddai_web"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# Exposes `live::replay::testutil` (a trace-b v2 fixture writer, see that module) outside
# `cfg(test)`, so `tests/*.rs` integration tests can build synthetic replay fixtures too, without
# any real Oracle B trace file ever touching this repository. Same pattern as `ddai-map`'s
# `test-util` feature (see its `Cargo.toml`'s comment).
test-util = []

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
cookie = "0.18"
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.7", features = ["trace", "timeout", "limit", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.6"
subtle = "2.6"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
tracing = "0.1"
thiserror = "2"
# Task 5.2a: the live map view.
ddai-physics = { path = "../ddai-physics" }
ddai-map = { path = "../ddai-map" }
ddai-trace = { path = "../ddai-trace" }
# Task 5.6: the control-channel protocol, name folding and the lists file shared with the bot.
ddai-botctl = { path = "../ddai-botctl" }
# Task 5.12: the favourites and proxy-profile rules, the master-list cache format and the proxy file parser are the client crate's.
ddai-client = { path = "../ddai-client" }
# Pure-Rust zlib deflate (no C dependency, same choice `ddai-map` already made) for the
# compressed `/api/map/<sha256>` scene payload.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Task 5.8: `config.toml` of a training run (already a dependency of the workspace).
toml = "1.1.6"
# Task 5.8: the `O_NOFOLLOW` / `O_NONBLOCK` constants for `OpenOptionsExt::custom_flags` when opening run files (a transitive dependency already).
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"
tokio-tungstenite = "0.29"
# Task 5.6: the bot-control test captures the web unit's log lines to prove no name is logged.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
futures-util = "0.3"
# Enables `ddai_map::testutil` (see that crate's own `[dev-dependencies]` for the same
# self-reference trick) so this crate's own tests can build a real, loadable synthetic `.map`
# fixture without a third-party map file ever touching this repository.
ddai-map = { path = "../ddai-map", features = ["test-util"] }
# Self-reference (same trick as above and as `ddai-map`'s own `[dev-dependencies]`): enables this
# crate's own `test-util` feature so `tests/*.rs` integration tests can reach
# `ddai_web::live::replay::testutil`.
ddai-web = { path = ".", features = ["test-util"] }
