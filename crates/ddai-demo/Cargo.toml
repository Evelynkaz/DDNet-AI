[package]
name = "ddai-demo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Safe, exact reader for DDNet's client-side .demo format (versions 4-6): header, chunks, tick-by-tick typed snapshots and game messages."

[lints]
workspace = true

[features]
# Exposes `testutil` (synthetic prelude/demo byte builders — see src/testutil.rs) outside
# `cfg(test)`, so `tests/*.rs` integration tests can build well-formed synthetic demos too,
# without a third-party `.demo` file ever touching this repository. Not meant to be enabled by
# anything other than this crate's own dev-dependency on itself, below (mirrors ddai-map's
# identical `test-util` feature).
test-util = []

[dependencies]
ddai-net = { path = "../ddai-net" }
thiserror = "2"

[dev-dependencies]
ddai-demo = { path = ".", features = ["test-util"] }
proptest = "1"
