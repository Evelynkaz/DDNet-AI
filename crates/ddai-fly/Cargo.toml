[package]
name = "ddai-fly"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The fly's inference engine plus its backward pass and training loop: loads a compiled `.flyg` connectome subgraph plus trainable parameters, runs the continuous-time rate model (FLY.md §4) forward in real time, and (task 7.2) trains it with hand-written truncated BPTT, Adam, and data-parallel batching. No input encoder / action decoder here (phase 7.3) — see README.md."

[lib]
name = "ddai_fly"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
ddai-flyg = { path = "../ddai-flyg" }
# Task 7.3: the shared `Brain`/`Observation`/`Action` interface `FlyBrain` implements, plus the
# map tile types the ray-grid encoder reads (`ddai-brain` re-exports the tuning/hook-state pieces
# it needs from `ddai-physics`, but the encoder reads `ddai_physics::map::MapData`'s tile constants
# directly, so both are listed explicitly rather than relying on `ddai-brain` to re-export them).
ddai-brain = { path = "../ddai-brain" }
ddai-physics = { path = "../ddai-physics" }
# Task 3.5: `FlyProposer` implements the hybrid brain's `Proposer` trait (the fly proposes plans,
# the exact search decides, D-041). The planner does not depend on the fly, so there is no cycle.
ddai-planner = { path = "../ddai-planner" }
serde = { version = "1.0.229", features = ["derive"] }
# Same feature choice as ddai-flyg/ddai-connectome (see their Cargo.toml comments): default-features
# = false drops the no_std `heapless-cas` feature (and its unmaintained transitive dependency,
# RUSTSEC-2023-0089) we don't need, since `use-std` already gives `to_allocvec`/`from_bytes`.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
zstd = "0.14.0"
# Not in acceptance criterion 1's core dependency list (ddai-flyg/serde/postcard/zstd), but needed
# for the checkpoint format's "sha256 of the `.flyg` it belongs to" (criterion 1e) — the same crate
# `ddai-connectome` already uses for its own sha256 hashing, so no new hashing implementation or
# license enters the tree.
sha2 = "0.11.0"
# Data-parallel batch training (acceptance criterion 4): `train_step` forward+backward's each
# sequence of a batch on a separate `rayon` worker, reducing into one gradient sequentially and
# deterministically (see `train.rs`'s doc comment) once all of them finish. The only new runtime
# dependency this task adds (constraints: "no external autodiff/ML frameworks ... rayon is fine").
rayon = "1.10"
# Task 7.3: reads `configs/fly/{S,M}-brain.toml` (ray-grid/decoder/world-model/proprioception
# config) — same version already used by `ddai-connectome` for `configs/fly/{S,M}.toml`.
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.14"
# Per-thread allocation counting for `tests/no_alloc.rs`/`no_alloc_brain.rs` — see `ddai-physics`'s
# Cargo.toml (task 1.10b review R2).
allocation-counter = "0.8.1"
# `tests/brain_demo_generalization.rs` only (review round 1, F2): loads the real "Copy Love Box"
# `.map` files for the held-out-maps generalization check. Not a library dependency -- the encoder
# itself only ever reads `ddai_physics::map::MapData` (already a dependency above), never parses a
# raw `.map` file.
ddai-map = { path = "../ddai-map" }
criterion = { version = "0.7", default-features = false }
# Thread pinning for the criterion benches only (the realistic 25 Hz duty-cycle loop lives in
# `ddnet-ai`, which pins independently — see its Cargo.toml comment). Kept a dev-dependency here so
# the library itself never links it.
core_affinity = "0.8"

[[bench]]
name = "decision"
harness = false
