[package]
name = "ddai-dataset"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Human-play dataset pipeline (task 8.4c): DDNet demos -> per-player trajectories -> reconstructed inputs -> (Observation, Action, meta) samples with technique tags, plus the chunked postcard+zstd dataset format and its reader."

[lib]
name = "ddai_dataset"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
ddai-brain = { path = "../ddai-brain" }
ddai-demo = { path = "../ddai-demo" }
ddai-map = { path = "../ddai-map" }
ddai-net = { path = "../ddai-net" }
ddai-physics = { path = "../ddai-physics" }
ddai-recorder = { path = "../ddai-recorder" }
ddai-world = { path = "../ddai-world" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
zstd = "0.14.0"
sha2 = "0.10"
thiserror = "2"

[features]
# Synthetic map/demo byte builders (`testutil`) for this crate's own integration tests: every byte
# is generated here, no third-party file ever touches the repository.
test-util = ["ddai-demo/test-util", "ddai-map/test-util"]

[dev-dependencies]
ddai-dataset = { path = ".", features = ["test-util"] }
tempfile = "3.14"
