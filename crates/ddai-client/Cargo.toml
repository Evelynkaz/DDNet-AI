[package]
name = "ddai-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "DDNet 20.x client session (task 2.3): a sans-IO join-sequence/snapshot/input-timing state machine over ddai-net, plus a real UDP driver exposing Client::connect/events/set_input/disconnect."

[lib]
name = "ddai_client"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
ddai-net = { path = "../ddai-net" }
ddai-map = { path = "../ddai-map" }
thiserror = "2"
tracing = "0.1"
# Only for `map_cache::sha256_of` (hashing bytes we have not yet handed to `ddai_map::load_map`,
# e.g. to check a cache hit *before* paying for a full `load_map`/CRC/sha256 verification pass);
# same crate `ddai-map` already depends on, so this adds no new dependency to the tree.
sha2 = "0.10"
# `live_servers` (task 8.4a): parses `~/aiddnet/data/live-servers.toml` (D-027/D-038's owner-
# curated non-loopback allow-list) — same `serde`+`toml` pattern `ddai-connectome`'s
# `manifest.rs`/`ddai-fly`'s `brain_config.rs` already use for their own TOML config files.
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
# `single_instance` (review round 1, F8): a per-server advisory file lock shared by `ddnet-ai
# play`/`record` (CLAUDE.md/D-016: "never more than one bot on a server") — a small, safe (no
# `unsafe` needed from us), cross-platform wrapper over the OS's own file-descriptor locking,
# which the OS releases automatically on process exit/crash/SIGKILL (no stale-lock cleanup logic
# needed, unlike a PID file).
fd-lock = "4.0.4"
# `server_list` (task 4.3): the read-only master-list JSON parser.
serde_json = "1"

[dev-dependencies]
tempfile = "3.14"
# Unlocks `ddai_map::testutil` (a tiny synthetic `.map` builder) for this crate's own tests, same
# pattern `ddai-map` uses on itself — see that crate's Cargo.toml.
ddai-map = { path = "../ddai-map", features = ["test-util"] }
