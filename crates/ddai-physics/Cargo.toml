[package]
name = "ddai-physics"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Dev-only diagnostic: per-phase `World::step` timing (task 1.10's profiling pass), read via
# `world::take_phase_profile()`. Off by default — zero cost (the `Instant::now()` calls compile
# out entirely) for every normal build, including the default `release` one every other crate
# links against.
phase_profile = []

[dependencies]

[dev-dependencies]
# Only for tests/benches: the golden fixtures, bulk trace corpus, scenario generator and
# `resolve_input` all live in `ddai-trace` (task 1.2). `ddai-trace` depends on `ddai-physics`
# (for `map::MapData`), never the other way around in non-dev code — this is a dev-only edge,
# not a cycle in the published dependency graph.
ddai-trace = { path = "../ddai-trace" }
serde_json = "1"
criterion = { version = "0.8", default-features = false }
stats_alloc = "0.1.10"

[[bench]]
name = "physics"
harness = false

[[example]]
name = "profile_world"
# Uses `world::take_phase_profile`, only compiled in under this feature (see its own doc
# comment) — `required-features` keeps a plain `cargo build`/`cargo test` (which builds every
# example target by default) from failing on this one without it.
required-features = ["phase_profile"]
