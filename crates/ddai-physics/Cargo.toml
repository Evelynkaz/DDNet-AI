[package]
name = "ddai-physics"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Dev-only diagnostic: per-phase `World::step` timing (task 1.10's profiling pass), read via
# `world::take_phase_profile()`. Off by default — zero cost (the `Instant::now()` calls compile
# out entirely) for every normal build, including the default `release` one every other crate
# links against.
phase_profile = []

[dependencies]

[dev-dependencies]
# Only for tests/benches: the golden fixtures, bulk trace corpus, scenario generator and
# `resolve_input` all live in `ddai-trace` (task 1.2). `ddai-trace` depends on `ddai-physics`
# (for `map::MapData`), never the other way around in non-dev code — this is a dev-only edge,
# not a cycle in the published dependency graph.
ddai-trace = { path = "../ddai-trace" }
serde_json = "1"
criterion = { version = "0.8", default-features = false }
# Per-*thread* allocation counting for the no-alloc tests (`tests/no_alloc*.rs`): `measure(|| ..)`
# counts only allocations made by the calling thread, so libtest's own worker/output-capture
# threads and other concurrently running tests can never leak into a measured window (task 1.10b
# review R2 — the previous process-global counters flaked in CI). Dev-dependency only; MIT/Apache-2.0
# (both already in `deny.toml`'s allow-list); the `unsafe` `GlobalAlloc` impl lives inside the crate,
# so none of *our* code needs `unsafe`. It installs itself as the test binary's `#[global_allocator]`.
allocation-counter = "0.8.1"

[[bench]]
name = "physics"
harness = false

[[example]]
name = "profile_world"
# Uses `world::take_phase_profile`, only compiled in under this feature (see its own doc
# comment) — `required-features` keeps a plain `cargo build`/`cargo test` (which builds every
# example target by default) from failing on this one without it.
required-features = ["phase_profile"]
