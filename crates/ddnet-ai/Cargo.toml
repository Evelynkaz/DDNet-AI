[package]
name = "ddnet-ai"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ddnet-ai"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The OS seam (task 5.5a, D-127): default data directories, owner-only files, load average, Unix sockets where they exist.
ddai-os = { path = "../ddai-os" }
# glibc-exact `hypot` (D-127).
ddai-libm = { path = "../ddai-libm" }
clap = { workspace = true }
ddai-bot = { path = "../ddai-bot" }
ddai-oppnet = { path = "../ddai-oppnet" }
# Task 3.5: the arena brain factory names `Brain` and builds the hybrid brain with the fly proposer.
ddai-brain = { path = "../ddai-brain" }
ddai-client = { path = "../ddai-client" }
# Task 4.3: `clip info|incidents|replay`.
ddai-clip = { path = "../ddai-clip" }
ddai-dataset = { path = "../ddai-dataset" }
ddai-demo = { path = "../ddai-demo" }
# Task 8.1: `arena` subcommand (the offline evaluation arena).
ddai-env = { path = "../ddai-env" }
ddai-controls = { path = "../ddai-controls" }
ddai-fly = { path = "../ddai-fly" }
ddai-flyg = { path = "../ddai-flyg" }
ddai-map = { path = "../ddai-map" }
# Task 8.4a's `ddai_net::generated::messages::{GameMsg,ExGameMsg}`/`ddai_net::snapshot::Snapshot`
# need to be named directly in `record_cmd` (the type `ddai-client` re-exports,
# `ddai_client::view::View`, borrows one) — same pattern as `ddai-physics` below.
ddai-net = { path = "../ddai-net" }
# Task 3.5: `HybridBrain` with `FlyProposer` (arena CLI).
ddai-planner = { path = "../ddai-planner" }
# Task 7.3's `fly brain-demo`: `ddai_physics::map::MapData` (`ddai-map::load_map`'s own return
# type) needs to be named directly here (an `Arc<MapData>` is built for `ddai_fly::demo_brain`).
ddai-physics = { path = "../ddai-physics" }
# Task 8.4a: rec v1 format/writer/reader/anonymize/reconstruct (`record_cmd`/`rec_cmd`).
ddai-recorder = { path = "../ddai-recorder" }
ddai-trace = { path = "../ddai-trace" }
# Task 8.2: `train` subcommands (teacher data, behaviour cloning, DAgger).
ddai-train = { path = "../ddai-train" }
ddai-web = { path = "../ddai-web" }
# Task 8.4a's `rec reconstruct --validate` deserializes `ddnet-ai play --input-log`'s JSON lines.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# `servers` / `--server auto` (task 4.3): the read-only master-list query. The same crate and feature as
# `ddai-connectome` already uses (no new package in the tree).
reqwest = { version = "0.13.5", features = ["blocking"] }
# Task 8.2: `train` run/collect configs are TOML (same version as ddai-connectome/ddai-env).
toml = "1.1.6"
# `demo stats`/`demo info`: falls back to hashing the embedded map's own bytes when a pre-v6 demo
# has no SHA256 extension, matching `CDemoPlayer::ExtractMap`'s fallback (`demo.cpp:940-950`,
# review round 1 finding F7) — same version already pinned by `ddai-map`'s own Cargo.toml.
sha2 = "0.10"
# Best-effort thread pinning for `fly bench`'s realistic 25Hz duty-cycle loop (acceptance
# criterion 4's methodology) — kept out of `ddai-fly` itself, which only takes it as a
# dev-dependency for its own criterion benches (see that crate's Cargo.toml comment).
core_affinity = "0.8"
# `record`/`play`'s graceful SIGINT/SIGTERM shutdown (review round 1, F8): finishes the current
# recording segment (sidecar sha256 included) and sends a real `NETMSG_CLOSE` instead of a bare
# `kill` leaving the slot connected server-side until the silence timeout.
ctrlc = { version = "3.5.2", features = ["termination"] }
tokio = { version = "1.53", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Task 5.12: a test binary that accepts a favourite on loopback (the local e2e with a private server). Never part of a production build.
[features]
loopback-favourites = ["ddai-client/loopback-favourites"]

[dev-dependencies]
tempfile = "3.14"
# Task 2.6: `tests/proxy_check.rs` and the SOCKS5 e2e run against the in-process loopback SOCKS5 server.
ddai-client = { path = "../ddai-client", features = ["test-util", "loopback-favourites"] }
