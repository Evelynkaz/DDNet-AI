[package]
name = "ddai-train"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Task 8.2: behaviour cloning and DAgger for the fly and its MLP/GRU controls -- teacher labelling in the arena (fixed-iteration planner, soft elite targets), chunked teacher datasets, the human-play mix, a resumable trainer, held-out per-head metrics."

[lib]
name = "ddai_train"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
ddai-brain = { path = "../ddai-brain" }
ddai-controls = { path = "../ddai-controls" }
ddai-dataset = { path = "../ddai-dataset" }
ddai-env = { path = "../ddai-env" }
ddai-fly = { path = "../ddai-fly" }
ddai-flyg = { path = "../ddai-flyg" }
ddai-map = { path = "../ddai-map" }
ddai-physics = { path = "../ddai-physics" }
ddai-planner = { path = "../ddai-planner" }
rayon = "1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
zstd = "0.14.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.14"
