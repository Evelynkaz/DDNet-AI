name: Ошибка / Bug
description: Бот или веб-интерфейс делает что-то не так / The bot or the web interface does something wrong
title: "Ошибка: "
labels: ["ошибка"]
body:
  - type: markdown
    attributes:
      value: |
        Лучше всего помогает демка DDNet (`.demo`) или клип бота (`ddnet-ai clip info`) плюс кусок журнала. Пароли, токены и ники других игроков не прикладывай.

        A DDNet demo (`.demo`) or a bot clip (`ddnet-ai clip info`) plus a piece of the log helps most. Leave out passwords, tokens and other players' names.
  - type: textarea
    id: what
    attributes:
      label: Что случилось / What happened
      description: Что делал бот и что должен был делать. / What the bot did and what it should have done.
      placeholder: Например, прыгнул во фриз на Copy Love Box, хотя рядом никого не было. / It jumped into freeze on Copy Love Box with nobody around.
    validations:
      required: true
  - type: textarea
    id: archive
    attributes:
      label: Клип, демка или журнал / Clip, demo or log
      description: Клип бота, файл .demo из DDNet или фрагмент журнала. / A bot clip, a .demo file from DDNet or a piece of the log.
  - type: input
    id: server
    attributes:
      label: Сервер и карта / Server and map
      placeholder: DDNet RUS - BLOCKER #4, Copy Love Box
  - type: input
    id: version
    attributes:
      label: Версия / Version
      description: Вывод `ddnet-ai --version` и хеш коммита. / The output of `ddnet-ai --version` and the commit hash.
  - type: dropdown
    id: os
    attributes:
      label: Система / System
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
