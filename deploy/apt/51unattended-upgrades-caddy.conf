// Review finding F5: Ubuntu's own /etc/apt/apt.conf.d/50unattended-upgrades only allows origins
// "Ubuntu:*"/"UbuntuESM*:*" — the Cloudsmith repository Caddy is installed from (deploy/install.sh,
// docs/SETUP.md §6) is not covered by that, so an internet-facing Caddy would otherwise never
// receive automatic security updates at all.
//
// The origin string below is not guessed: it is the Cloudsmith repo's actual Release file
// `Origin:` field, confirmed live with `apt-cache policy caddy` (docs/SETUP.md §6). Installed to
// /etc/apt/apt.conf.d/51unattended-upgrades-caddy by deploy/install.sh. apt.conf.d list options
// (like this one) accumulate across files rather than replacing each other, so this only adds to
// — never replaces — Ubuntu's own defaults in 50unattended-upgrades.
Unattended-Upgrade::Origins-Pattern {
	"origin=cloudsmith/caddy/stable";
};
