# Local-only DDNet 20.1 dedicated server config. Committed, no secrets.
#
# Loaded via `DDNet-Server -f .../local.cfg -f .../ddnet-server-secrets.cfg`
# with the working directory set to ~/aiddnet/data/ddnet-server/ (see
# install-service.sh / README.md). The systemd unit points its `-f` at a
# STABLE copy of this file under ~/aiddnet/data/ddnet-server/local.cfg
# (install-service.sh refreshes it on every install), not at this repo path,
# so the service keeps working even if this checkout goes away later.
#
# Never reachable from the internet and never registers with the DDNet
# master servers. Defense in depth (see README.md "Безопасность"): the unit
# also fails closed (ExecStartPre) if this file or the secrets file is
# missing, passes bindaddr/sv_register/sv_ipv4only again directly on its
# ExecStart command line, and sandboxes the process with
# IPAddressAllow=127.0.0.0/8 ::1 / IPAddressDeny=any - so even a config bug
# here would not actually expose anything beyond loopback.

bindaddr 127.0.0.1
sv_port 8303
sv_register 0
# Bind IPv4 only, explicitly - avoids DDNet also attempting (and logging an
# error for) an IPv6 socket next to the IPv4 one when this is left at its
# default of 0 (see server.cpp: `BindAddr.type = sv_ipv4only ? NETTYPE_IPV4
# : NETTYPE_ALL`). Has no bearing on whether the process is loopback-only -
# that's what `bindaddr 127.0.0.1` + `sv_register 0` already guarantee -
# it just removes a confusing, unrelated log line.
sv_ipv4only 1

sv_name "aiddnet local dev server (127.0.0.1 only, not on the DDNet master list)"
sv_map "Copy Love Box"
sv_max_clients 12
# The bundled data/autoexec_server.cfg (which runs automatically before this
# file) sets `sv_max_clients_per_ip 4`, which blocks more than 4 simultaneous
# local bots/test clients from 127.0.0.1. Raise it to sv_max_clients so local
# multi-client testing isn't throttled by a limit meant for the public case
# of many distinct players sharing one NAT'd IP.
sv_max_clients_per_ip 12
# Same file's `sv_connlimit`/`sv_connlimit_time` (5 connections / 20s per IP)
# is an anti-DoS measure for public servers; it also throttles our own
# scripted reconnect tests from 127.0.0.1. Disable the time window locally.
sv_connlimit_time 0

# The bundled autoexec_server.cfg also sets `sv_test_cmds 1` (rcon cheats,
# "TestDDraceNetwo" server type) and adds a few custom votes, including an
# "Option: Shutdown server" vote that any connected client could pass. Keep
# vanilla (non-cheat) behavior for physics realism and drop the stock votes -
# nobody needs to vote anything on a private, bot-only test server.
sv_test_cmds 0
clear_votes

# Default snapshot rate (25 Hz), not the LAN-only high-bandwidth mode.
sv_high_bandwidth 0

# NOTE: the spec/docs call this "teehistorian" (sv_teehistorian); the actual
# DDNet 20.1 cvar is `sv_tee_historian` (config_variables.h). Files land in
# <storage save path>/teehistorian/<game-uuid>.teehistorian, i.e. under
# ~/aiddnet/data/ddnet-server/teehistorian/.
sv_tee_historian 1

# Econ (external console) for scripted admin: change_map, status, broadcast,
# shutdown. Bound to loopback only. Password comes from the secrets file,
# loaded as a SECOND `-f` argument (see below), never from this file.
ec_bindaddr 127.0.0.1
ec_port 8304

loglevel 0
logappend 1
# `logfile` is intentionally NOT set here: a committed file shouldn't bake in
# one absolute path. install-service.sh passes it on the command line
# (`logfile <path under ~/aiddnet/data/logs/ddnet-server/>`), which is parsed
# the same way a config line would be (engine/shared/console.cpp
# ParseArguments -> ExecuteLine for any argv entry that isn't `-f`/`-s`).
# Running by hand outside systemd, without a logfile, is fine too - console
# output already goes to stdout.

# Secrets (sv_rcon_password / ec_password) load from a SEPARATE `-f` argument
# pointing straight at ~/aiddnet/data/secrets/ddnet-server-secrets.cfg
# (mode 0600, generated by tools/ddnet-server/gen-secrets.sh), e.g.:
#   DDNet-Server -f local.cfg -f ~/aiddnet/data/secrets/ddnet-server-secrets.cfg
# `-f` explicitly supports absolute paths (IStorage::TYPE_ABSOLUTE); the
# plain `exec` console command does not (storage.cpp: "don't escape base
# directory"), which is why this isn't `exec ddnet-server-secrets.cfg` here -
# that would need the whole secrets directory on the storage search path,
# which install-service.sh/setup-runtime.sh deliberately avoid (README.md
# "Runtime-раскладка и секреты").
