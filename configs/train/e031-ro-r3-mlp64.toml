# E-031 (task 8.7), readout arm "r3-mlp64": BC of the hook head's readout with the network frozen. The data, loss weights, optimiser, seed, windows and the
# opening boost are those of E-029 (configs/train/e029-bc-legacy.toml); the hook head alone trains (s2-mlp-dn-64.bundle).
#   ddnet-ai train run --config configs/train/e031-ro-r3-mlp64.toml
name = "e031-ro-r3-mlp64"
flyg = "~/aiddnet/data/connectome/compiled/fly-S-v1.flyg"
brain_config = "configs/fly/S-brain-dg.toml"
init_bundle = "~/aiddnet/data/runs/E-031/bundles/s2-mlp-dn-64.bundle"
arenas_dir = "configs/arenas"
map_dir = "~/aiddnet/data/maps"
scenarios_dir = "configs/scenarios"
run_dir = "~/aiddnet/data/runs/E-031/ro-r3-mlp64"
teacher_base = [
    "~/aiddnet/data/datasets/teacher/round0-v1",
    "~/aiddnet/data/datasets/teacher/round1-v2",
    "~/aiddnet/data/datasets/teacher/e022-postfreeze",
    "~/aiddnet/data/runs/E-023/e023-ppo-base-s2/dagger",
    "~/aiddnet/data/runs/E-023/e023-ppo-cur4-s2/dagger",
    "~/aiddnet/data/runs/E-023/e023-ppo-cur6-s2/dagger",
    "~/aiddnet/data/runs/E-023/e023-ppo-cur7-s2/dagger",
]
teacher_dagger = "~/aiddnet/data/datasets/teacher/e031-ro-r3-mlp64-dagger"
bc_steps = 800
eval_every = 0

[model]
kind = "fly"

[fly]
lr_a = 0.0
lr_b = 0.0
lr_theta = 0.0
lr_encoder = 0.0
lr_decoder = 1e-2
lr_hook_wide = 3e-3
readout_only = true
l2_a = 0.0
alpha_init = 4.0
calibration_windows = 300

[train]
seed = 2
batch_windows = 24
window_len = 32
burn_in = 6
warmup_steps = 50
lr_final_frac = 0.1
threads = 3
log_every = 50
eval_windows = 600

[train.loss]
pos_weight = [3.0, 1.0, 6.0]

[train.own_hook]
mode = "mask_hook_head"

[teacher_data]
val_mod = 10
round_weights = [[7, 6.0], [8, 6.0], [100, 6.0]]
scenario_weight = 2.0
opening_boost = 8.0
opening_ticks = 32
opening_rounds = [7, 8, 100]
aim_mask = "throw_or_fire"
