# T6 -- hold the wayblock spot and drop what arrives (block-knowledge.md §2.1 T6; old bot
# wayblock.ts, chillblock5_blocker.cpp) -- a Copy Love Box point scenario.
#
# The left wayblock hall's lower floor (row 84, x 93..104) ends at a freeze pillar (x 105..106).
# B stands one and a half tiles from the pillar; A stands next to it on the far side. A hammer
# blow throws B into the pillar. Success: B goes out within 40 ticks, credited to A; A never out.
# (The original catalogue row also counts blocks per minute over a long stay; that is measured by
# the games in `clb-left`, this is the single-block skill on the real geometry.)
