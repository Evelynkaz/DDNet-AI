# T11 -- edge stance under pressure (block-knowledge.md §2.1 T11; DDNet wiki "Edge").
#
# A stands on the last tile before a one-tile freeze pit; B, 7 tiles away on the far side, hooks A
# and walks away, dragging it over the pit. Success: A is never out for 100 ticks. (The catalogue
# asks for time spent on the edge without a freeze; standing still there is what the drag punishes.)
id = "T11"
name = "Edge stance under pressure"
source = "block-knowledge.md §2.1 T11; DDNet wiki Edge"
description = "A stands at the edge of a one-tile pit while B drags it with a hook from the far side."
horizon = 100
trials = 20

[map]
kind = "synthetic"
width = 60
height = 16
border = true
rects = [
    { x0 = 1, y0 = 10, x1 = 58, y1 = 13, tile = "solid" },
    { x0 = 30, y0 = 10, x1 = 30, y1 = 11, tile = "freeze" },
]

[[tee]]
pos = [29.5, 9.5]
jitter = [0.3, 0.0]

[[tee]]
pos = [36.5, 9.5]
script = [{ from = 0, direction = 1, hook = true, aim = [-300, 0] }]

[success]
kind = "not_out"
tee = 0


