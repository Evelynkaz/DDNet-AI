# T17 -- do not stand next to a frozen opponent when a free third tee is around (block-knowledge.md
# §2.1 T17): the third can drag you into the freeze behind you.
#
# A stands beside the frozen B with a five-wide freeze pit to A's right and the free third tee C
# on the pit's far side, at hook range, hooking A and walking away. Success: A is never out for 110
# ticks. Standing still lets C drag A over the pit.
id = "T17"
name = "Do not stand by the frozen opponent with a free third around"
source = "block-knowledge.md §2.1 T17"
description = "A next to a frozen B; the free third tee drags A with a hook across a freeze pit."
horizon = 110
trials = 20

[map]
kind = "synthetic"
width = 60
height = 16
border = true
rects = [
    { x0 = 1, y0 = 10, x1 = 58, y1 = 13, tile = "solid" },
    { x0 = 25, y0 = 10, x1 = 29, y1 = 11, tile = "freeze" },
]

[[tee]]
pos = [23.5, 9.5]
jitter = [0.4, 0.0]

[[tee]]
pos = [21.5, 9.5]
freeze_ticks = 400

[[tee]]
pos = [33.5, 9.5]
script = [{ from = 0, direction = 1, hook = true, aim = [-300, 0] }]

[success]
kind = "not_out"
tee = 0


