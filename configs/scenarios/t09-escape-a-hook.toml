# T9 -- get out of an opponent's hook (block-knowledge.md §2.1 T9; Steam guide "DDNet basics":
# hook the floor, hit the blocker; bot v3 "stay strong": walk against the pull).
#
# B has hooked A from across a 5-wide freeze pit and walks away, dragging A towards the pit; a
# solid pillar stands two tiles behind A. A player hook lasts at most about 60 ticks. Success: A is
# never out for the whole horizon.
id = "T9"
name = "Escape an opponent's hook"
source = "block-knowledge.md §2.1 T9; Steam guide 'DDNet basics'; bot v3 'stay strong'"
description = "B drags A towards a freeze pit with its hook; resist, break the hook or anchor to the pillar."
horizon = 130
trials = 20

[map]
kind = "synthetic"
width = 60
height = 16
border = true
rects = [
    { x0 = 1, y0 = 10, x1 = 58, y1 = 13, tile = "solid" },
    { x0 = 33, y0 = 10, x1 = 37, y1 = 11, tile = "freeze" },
    { x0 = 25, y0 = 6, x1 = 26, y1 = 9, tile = "solid" },
]

[[tee]]
pos = [29.5, 9.5]
jitter = [0.4, 0.0]

[[tee]]
pos = [40.5, 9.5]
hooking = 0
script = [{ from = 0, direction = 1, hook = true, aim = [-300, 0] }]

[success]
kind = "not_out"
tee = 0

