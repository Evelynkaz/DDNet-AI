# E-007 part 11: the commitment bonus (`warm_bonus`) of the warm plan, 1v1 against the fixed planner on clb-left,
# 400 games, seed 1500, hybrid 4 ms on the work clock, adaptive off.
#   ddnet-ai arena run --config configs/arena/e007-warm-b.toml --out ~/aiddnet/data/runs/E-007/warm-b --threads 4
name = "E-007 warm bonus seed 1500"
base_seed = 1500
games = 400

[[condition]]
name = "1v1 warm bonus 0.0"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, hybrid = { adaptive = false, warm_bonus = 0.0 } }, { brain = "planner", mode = "fixed" }]

