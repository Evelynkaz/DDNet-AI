# E-007 part 12: the dynamic stage 2 only with 3+ opponents able to act (`stage2_dynamic_min_relevant = 3`): where it helped
# (1v5: credited 83% -> 89.5%) and not where it hurt (a duel: T15a, T18). Defaults (warm bonus 0.3, air cost 0.5, cap 4 + crowd
# stage), 1v2/1v3/1v5 on clb-left, 200 games each, work clock, adaptive off, seed 1.
#   ddnet-ai arena run --config configs/arena/e007-dyn3.toml --out ~/aiddnet/data/runs/E-007/dyn3 --threads 4
name = "E-007 dynamic stage 2, crowds only"
base_seed = 1
games = 200

[[condition]]
name = "1v3 defaults"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { adaptive = false } }, { brain = "scripted", count = 3 }]

[[condition]]
name = "1v3 + dynamic stage 2 (3+ opponents)"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { adaptive = false, stage2_dynamic = true } }, { brain = "scripted", count = 3 }]

[[condition]]
name = "1v5 defaults"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { adaptive = false } }, { brain = "scripted", count = 5 }]

[[condition]]
name = "1v5 + dynamic stage 2 (3+ opponents)"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { adaptive = false, stage2_dynamic = true } }, { brain = "scripted", count = 5 }]

[[condition]]
name = "1v2 defaults"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { adaptive = false } }, { brain = "scripted", count = 2 }]

[[condition]]
name = "1v2 + dynamic stage 2 (3+ opponents)"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { adaptive = false, stage2_dynamic = true } }, { brain = "scripted", count = 2 }]
