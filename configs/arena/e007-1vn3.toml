# E-007 (task 3.5b), part 9: tempo against safety in 1vN. The project's rating is (blocks - 0.5 * self-freezes)
# per minute: the 1v1 model (only the victim modelled) wins it in 1v3, the threat model loses fewer games. Threat weight,
# the worst-case weight lambda and the dynamic stage 2, on top of the cap-4 + crowd-stage default; 1v3 and 1v5 on
# clb-left, 200 games each, work clock, adaptive off.
#   ddnet-ai arena run --config configs/arena/e007-1vn3.toml --out ~/aiddnet/data/runs/E-007/1vn3 --threads 4
name = "E-007 tempo vs safety"
base_seed = 1
games = 200

[[condition]]
name = "1v3 cap 4 + crowd stage (reference)"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { adaptive = false, warm_bonus = 0.3, jumpless_air_cost = 0.5, max_sim_tees = 4, crowd_stage = true } }, { brain = "scripted", count = 3 }]

[[condition]]
name = "1v3 1v1 model (reference)"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { adaptive = false, warm_bonus = 0.3, jumpless_air_cost = 0.5, threat_model = false } }, { brain = "scripted", count = 3 }]

[[condition]]
