# work-clock: default-rate
# Task 3.10 (E-021): held block, hybrid vs the OLD fixed planner (3 halls x 400, both arms)
# FRESH seeds 4001.. (never used while the finishing switches were developed: the screens used 6001..). Both arms of a pair play the same games
# (same seeds and layouts), so they pair up for McNemar; the finishing arm is "finish" = `hybrid = { frozen_drag_weight = 20.0 }` (= `HybridConfig::with_finish`).
#   ddnet-ai arena run --config configs/arena/e021-held-old.toml --out ~/aiddnet/data/runs/E-021/held-old --threads 3
name = "E-021: held block, hybrid vs the OLD fixed planner (3 halls x 400, both arms)"
base_seed = 4001
games = 400

[rules]
after_ticks = 250

[[condition]]
name = "clb-left base vs old"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0 }, { brain = "planner", mode = "fixed" }]

[[condition]]
name = "clb-left finish vs old"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, hybrid = { frozen_drag_weight = 20.0 } }, { brain = "planner", mode = "fixed" }]

[[condition]]
name = "clb-right base vs old"
arena = "clb-right"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0 }, { brain = "planner", mode = "fixed" }]

[[condition]]
name = "clb-right finish vs old"
arena = "clb-right"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, hybrid = { frozen_drag_weight = 20.0 } }, { brain = "planner", mode = "fixed" }]

[[condition]]
name = "chillblock5 base vs old"
arena = "chillblock5-ruler"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0 }, { brain = "planner", mode = "fixed" }]

[[condition]]
name = "chillblock5 finish vs old"
arena = "chillblock5-ruler"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, hybrid = { frozen_drag_weight = 20.0 } }, { brain = "planner", mode = "fixed" }]
