# E-007 (task 3.5b), part 3: crowds. The hybrid at 4 ms (work clock, adaptive on) on clb-left with 8, 10,
# 12 and 15 tees: "idle" = one scripted attacker plus idle bystanders, "scripted" = everybody attacks.
# Tees from slot 2 on spawn anywhere on the standing cells, one tile apart (a dense hub). `max_sim_tees = 0`
# is the 3.5 behaviour (every tee in the rollouts); 6 is the 3.5b default (local tees only).
#   ddnet-ai arena run --config configs/arena/e007-crowd.toml --out ~/aiddnet/data/runs/E-007/crowd --threads 4
name = "E-007 crowds"
base_seed = 900
games = 200

[rules]
crowd_from = 2
crowd_spacing = 1.0

[[condition]]
name = "8 tees idle 3.5 all tees"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { max_sim_tees = 0 } }, { brain = "scripted" }, { brain = "idle", count = 6 }]

[[condition]]
name = "8 tees idle 3.5b local tees"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { max_sim_tees = 6 } }, { brain = "scripted" }, { brain = "idle", count = 6 }]

[[condition]]
name = "8 tees scripted 3.5 all tees"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { max_sim_tees = 0 } }, { brain = "scripted", count = 7 }]

