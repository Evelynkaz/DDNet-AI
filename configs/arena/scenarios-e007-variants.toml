# E-007 (task 3.5b): technique scenarios T1-T18 with the speed options of the search (dynamic stage 2, early
# pruning, a smaller stage-2 share), hybrid 4 ms on the work clock, adaptive on, 200 trials; the planner at fixed
# work for reference.
#   ddnet-ai arena scenarios --config configs/arena/scenarios-e007-variants.toml --out ~/aiddnet/data/runs/E-007/variants-scenarios
name = "scenarios E-007 variants"
seed = 1
trials = 200

[[brain]]
label = "planner-fixed"
brain = "planner"
mode = "fixed"

[[brain]]
label = "base"
brain = "hybrid"
mode = "deadline"
clock = "work", step_ms = 0.0022
budget_ms = 4.0

[[brain]]
label = "dynamic stage 2"
brain = "hybrid"
mode = "deadline"
clock = "work", step_ms = 0.0022
budget_ms = 4.0
hybrid = { stage2_dynamic = true }

[[brain]]
label = "prune 3/0.5"
brain = "hybrid"
mode = "deadline"
clock = "work", step_ms = 0.0022
budget_ms = 4.0
hybrid = { prune = true }

[[brain]]
label = "dynamic + prune"
brain = "hybrid"
mode = "deadline"
clock = "work", step_ms = 0.0022
budget_ms = 4.0
hybrid = { stage2_dynamic = true, prune = true }

[[brain]]
label = "stage2 0.2"
brain = "hybrid"
mode = "deadline"
clock = "work", step_ms = 0.0022
budget_ms = 4.0
hybrid = { stage2_fraction = 0.2 }

[[brain]]
label = "crowd stage"
brain = "hybrid"
mode = "deadline"
clock = "work", step_ms = 0.0022
budget_ms = 4.0
hybrid = { crowd_stage = true }
