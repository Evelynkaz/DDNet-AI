# work-clock: default-rate
# Task 3.15 (E-028): games of our hybrid (main defaults, 4 ms of WORK, the window model m1 playing: the DAgger round of the iteration, so the opponent is recorded in the states the model-driven hybrid reaches) against live-v2 at several lags, recorded by `opp_record` as the dataset of the opponent-input predictor.
# Seeds: train 50001.., val 60001.., test 70001.. (none of them used by E-017/E-019/E-020/E-026, whose seeds are 1..4000 and 7001/11001).
#   cargo run --release -p ddai-env --example opp_record -- --config configs/arena/e028-data-dagger.toml --out ~/aiddnet/data/runs/E-028/data/dagger --threads 3
name = "e028-data-dagger"
base_seed = 52001
games = 100

[[condition]]
name = "joni 3/0"
arena = "joni-duel"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, lag = 3, hybrid = { window_model = "~/aiddnet/data/runs/E-028/m1.oppnet" } }, { brain = "planner", mode = "fixed", preset = "live-v2", lag = 0 }]

[[condition]]
name = "joni 3/1"
