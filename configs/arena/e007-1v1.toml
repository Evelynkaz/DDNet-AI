# E-007 (task 3.5b), part 2: 1v1 strength of the hybrid at 4 ms (work clock, adaptive on) against the
# fixed-iteration planner (the stable reference; ~47 candidates), clb-left, 400 games per variant:
# early pruning and the stage-2 share. Wilson intervals of 400 games are about +-5 points, so only large
# effects show.
#   ddnet-ai arena run --config configs/arena/e007-1v1.toml --out ~/aiddnet/data/runs/E-007/1v1 --threads 4
name = "E-007 1v1 tuning"
base_seed = 500
games = 400

[[condition]]
name = "base"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0 }, { brain = "planner", mode = "fixed" }]

[[condition]]
name = "prune 3/0.5"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { prune = true } }, { brain = "planner", mode = "fixed" }]

[[condition]]
name = "prune 2/0.35"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { prune = true, prune_steps = 2, prune_keep = 0.35 } }, { brain = "planner", mode = "fixed" }]

[[condition]]
name = "stage2 0.2"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { stage2_fraction = 0.2 } }, { brain = "planner", mode = "fixed" }]

[[condition]]
name = "stage2 0.2 + prune 3/0.5"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { stage2_fraction = 0.2, prune = true } }, { brain = "planner", mode = "fixed" }]

[[condition]]
name = "top_m 2"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { top_m = 2 } }, { brain = "planner", mode = "fixed" }]
