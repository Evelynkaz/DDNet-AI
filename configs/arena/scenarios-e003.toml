# E-003, part 4 (the hybrid deadline modes run on the work clock, `clock = "work", step_ms = 0.0022`, 2.2 us per tee-tick): technique scenarios T1-T18, hybrid vs the plain planner (task 3.5, D-048), 50 trials
# each. Run:
#   ddnet-ai arena scenarios --config configs/arena/scenarios-e003.toml --out ~/aiddnet/data/runs/E-003/scenarios
name = "scenarios E-003"
seed = 1
trials = 50

[[brain]]
label = "planner-fixed"
brain = "planner"
mode = "fixed"

[[brain]]
label = "planner-4ms"
brain = "planner"
mode = "deadline"
budget_ms = 4.0

[[brain]]
label = "hybrid-fixed"
brain = "hybrid"
mode = "fixed"

[[brain]]
label = "hybrid-4ms"
brain = "hybrid"
mode = "deadline"
clock = "work", step_ms = 0.0022
budget_ms = 4.0
hybrid = { adaptive = false }

[[brain]]
label = "hybrid-adaptive"
brain = "hybrid"
mode = "deadline"
clock = "work", step_ms = 0.0022
budget_ms = 4.0

[[brain]]
label = "hybrid-fixed-no-techniques"
brain = "hybrid"
mode = "fixed"
hybrid = { techniques = false }
