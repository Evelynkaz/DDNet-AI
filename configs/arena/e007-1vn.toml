# E-007 (task 3.5b), part 4: 1vN without passivity. Crowd stage (the two extremes for 3+ opponents) and the
# local-tee cap, in 1v3 and 1v5 on clb-left, 200 games each, work clock, adaptive off (the 4 ms search alone).
# Reference: the 1v1 model (only the victim modelled) and the plain 3.5 hybrid (`max_sim_tees = 0`).
#   ddnet-ai arena run --config configs/arena/e007-1vn.toml --out ~/aiddnet/data/runs/E-007/1vn --threads 4
name = "E-007 1vN"
base_seed = 1
games = 200

[[condition]]
name = "1v3 3.5 (all tees, no crowd stage)"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { adaptive = false, max_sim_tees = 0 } }, { brain = "scripted", count = 3 }]

[[condition]]
name = "1v3 cap 6"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { adaptive = false, max_sim_tees = 6 } }, { brain = "scripted", count = 3 }]

[[condition]]
name = "1v3 cap 4"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { adaptive = false, max_sim_tees = 4 } }, { brain = "scripted", count = 3 }]

[[condition]]
name = "1v3 cap 6 + crowd stage"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { adaptive = false, max_sim_tees = 6, crowd_stage = true } }, { brain = "scripted", count = 3 }]

[[condition]]
name = "1v3 cap 4 + crowd stage"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { adaptive = false, max_sim_tees = 4, crowd_stage = true } }, { brain = "scripted", count = 3 }]

[[condition]]
name = "1v3 1v1 model"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { adaptive = false, threat_model = false } }, { brain = "scripted", count = 3 }]

[[condition]]
name = "1v5 3.5 (all tees, no crowd stage)"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { adaptive = false, max_sim_tees = 0 } }, { brain = "scripted", count = 5 }]

