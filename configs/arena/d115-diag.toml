# work-clock: default-rate
# Task 3.19 (D-116, E-034): the arena-vs-live hammer gap. The same hybrid (main defaults, 4 ms WORK) against live-v2 on today's box at lag 2/1, four ways:
# the true world (as every arena so far) or the live view (LiveWorld from server-style snapshots), under the old first-freeze rule or the F-DDrace round rules.
#   cargo run --release -p ddai-env --example duel_stats -- --config configs/arena/d115-diag.toml --threads 3 --games 100
name = "d115 diag: true vs live view, old rule vs round rules"
base_seed = 19001
games = 100

[[condition]]
name = "true view, first freeze"
arena = "pm1007-clb-duel"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, lag = 2 }, { brain = "planner", mode = "fixed", preset = "live-v2", lag = 1 }]

[[condition]]
name = "live view, first freeze"
arena = "pm1007-clb-duel"
duel = { rounds = false, live_view = [0] }
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, lag = 2 }, { brain = "planner", mode = "fixed", preset = "live-v2", lag = 1 }]

[[condition]]
name = "true view, round rules"
arena = "pm1007-clb-duel"
duel = {}
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, lag = 2 }, { brain = "planner", mode = "fixed", preset = "live-v2", lag = 1 }]

[[condition]]
name = "live view, round rules"
arena = "pm1007-clb-duel"
duel = { live_view = [0] }
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, lag = 2 }, { brain = "planner", mode = "fixed", preset = "live-v2", lag = 1 }]
