# work-clock: default-rate
# Task 3.6 (D-076, E-010): OLD = the 2.2 us work clock of E-003/E-007 (pinned), NEW = the default `WORK_US_PER_TEE_TICK` (1.25 us),
# same seeds and layouts, so games pair up for McNemar.
#   ddnet-ai arena run --config configs/arena/e010-threat.toml --out ~/aiddnet/data/runs/E-010/threat --threads 3
name = "E-010: 1vN, old vs new work-clock calibration"
base_seed = 1
games = 200

[[condition]]
name = "1v2 hybrid 4 ms OLD"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0 }, { brain = "scripted", count = 2 }]

[[condition]]
name = "1v2 hybrid 4 ms NEW"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0 }, { brain = "scripted", count = 2 }]

[[condition]]
name = "1v3 hybrid 4 ms OLD"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0 }, { brain = "scripted", count = 3 }]

[[condition]]
name = "1v3 hybrid 4 ms NEW"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0 }, { brain = "scripted", count = 3 }]

[[condition]]
name = "1v5 hybrid 4 ms OLD"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0 }, { brain = "scripted", count = 5 }]

[[condition]]
name = "1v5 hybrid 4 ms NEW"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0 }, { brain = "scripted", count = 5 }]

