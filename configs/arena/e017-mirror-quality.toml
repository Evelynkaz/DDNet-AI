arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 12.0, hybrid = { decision_cap_ms = 0, mirror = false } }, { brain = "planner", mode = "fixed" }]

[[condition]]
name = "clb-right: hybrid 12 ms WORK mirror off vs planner fixed"
arena = "clb-right"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 12.0, hybrid = { decision_cap_ms = 0, mirror = false } }, { brain = "planner", mode = "fixed" }]

