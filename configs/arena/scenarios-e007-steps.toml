# E-007 part 5: technique scenarios with a shorter planning horizon, hybrid 4 ms (work clock, adaptive on), 200 trials.
#   ddnet-ai arena scenarios --config configs/arena/scenarios-e007-steps.toml --out ~/aiddnet/data/runs/E-007/steps-scenarios
name = "scenarios E-007 horizon"
seed = 1
trials = 200

[[brain]]
label = "base"
brain = "hybrid"
mode = "deadline"
clock = "work"
budget_ms = 4.0

[[brain]]
label = "steps 6 x 3"
brain = "hybrid"
mode = "deadline"
clock = "work"
budget_ms = 4.0
hybrid = { plan_steps = 6 }

[[brain]]
label = "steps 7 x 3"
brain = "hybrid"
mode = "deadline"
clock = "work"
budget_ms = 4.0
hybrid = { plan_steps = 7 }

[[brain]]
label = "steps 9 x 2"
brain = "hybrid"
mode = "deadline"
clock = "work"
budget_ms = 4.0
hybrid = { plan_step_ticks = 2 }

[[brain]]
label = "steps 6 x 3 + dynamic"
brain = "hybrid"
mode = "deadline"
clock = "work"
budget_ms = 4.0
hybrid = { plan_steps = 6, stage2_dynamic = true }
