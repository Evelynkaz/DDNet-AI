# work-clock: default-rate
# Task 3.9 (D-096, E-020): SCREENING, round 2 -- the same games as `e020-screen.toml` (seeds 5001..5200 per hall, vs `normal-v2`), so the arm "main" of round 1
# is the baseline. Round 1 showed that the `polish` arm was identical to main (the first version polished only while stage 1 had time left, which a deadline
# search never does; fixed since), so `polish` runs again; the others are combinations of the switches that moved in the right direction
# (mirror on v2, rope ceiling), the mirror on the competitor's live planner, and everything on.
#   ddnet-ai arena run --config configs/arena/e020-screen2.toml --out ~/aiddnet/data/runs/E-020/screen2 --threads 3
name = "E-020: screening round 2 of the v2 switches in the hybrid vs v2, seeds 5001.."
base_seed = 5001
games = 200

[[condition]]
name = "clb-left: polish vs v2"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, hybrid = { polish = true, hook_keep_flying = true } }, { brain = "planner", mode = "fixed", preset = "normal-v2" }]

[[condition]]
name = "clb-right: polish vs v2"
arena = "clb-right"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, hybrid = { polish = true, hook_keep_flying = true } }, { brain = "planner", mode = "fixed", preset = "normal-v2" }]

