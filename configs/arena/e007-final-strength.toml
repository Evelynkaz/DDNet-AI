# E-007 final matrix (task 3.5b): the final defaults on the work clock (hybrid = {} is the default config), credited win
# rate (D-059) with an idle baseline on the same arenas and seeds (e007-idle*.toml).
#   ddnet-ai arena run --config configs/arena/e007-final-strength.toml --out ~/aiddnet/data/runs/E-007/final/strength --threads 4
name = "E-007 final: strength"
base_seed = 1
games = 200

[[condition]]
name = "clb-left: hybrid 4 ms vs scripted"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0 }, { brain = "scripted" }]

[[condition]]
name = "clb-left: hybrid fixed vs scripted"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "fixed" }, { brain = "scripted" }]

[[condition]]
name = "clb-left: planner fixed vs scripted"
arena = "clb-left"
players = [{ brain = "planner", mode = "fixed" }, { brain = "scripted" }]

[[condition]]
name = "clb-left: hybrid 4 ms vs planner fixed"
arena = "clb-left"
games = 400
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0 }, { brain = "planner", mode = "fixed" }]

