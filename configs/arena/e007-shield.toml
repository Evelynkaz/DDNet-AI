# E-007 (task 3.5b), part 1: the shield that understands hooks, judged by outcomes (self-freezes and
# blocks per minute, losses) in 1v2/1v3/1v5 on clb-left, 200 games each, work clock, adaptive on (the
# default: the shield's danger extension is part of what is measured). Variants:
#   3.5                 the merged shield (walk/jump escapes only)
#   plan                + the remainder of the chosen plan is the first escape
#   plan+hooks          + hook escapes at three anchors
#   plan+hooks+timeout  + a timed-out check counts as danger (saferInput gets the extension budget)
# ddnet-ai arena run --config configs/arena/e007-shield.toml --out ~/aiddnet/data/runs/E-007/shield --threads 4
name = "E-007 shield"
base_seed = 1
games = 200

[[condition]]
name = "1v2 shield 3.5"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { shield_plan_escape = false, shield_hook_anchors = 0 } }, { brain = "scripted", count = 2 }]

[[condition]]
name = "1v2 shield plan"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { shield_plan_escape = true, shield_hook_anchors = 0 } }, { brain = "scripted", count = 2 }]

[[condition]]
name = "1v2 shield plan+hooks"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { shield_plan_escape = true, shield_hook_anchors = 3 } }, { brain = "scripted", count = 2 }]

[[condition]]
name = "1v2 shield plan+hooks+timeout"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { shield_plan_escape = true, shield_hook_anchors = 3, shield_timeout_danger = true } }, { brain = "scripted", count = 2 }]

