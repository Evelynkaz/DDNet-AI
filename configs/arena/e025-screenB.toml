# work-clock: default-rate
# NOTE (E-025): this run was stopped after the third condition (clb-left: mirlive, liveW-mirlive, fly); the clb-right halves were played from e025-screenD.toml and fly8 from e025-screenC.toml. The conditions liveW and hold were NOT played (no compute).
# Task 3.13 (E-025): development screen on game indices 0..99 of the E-020 fresh set (seeds 6001..6100): the arms main and cand=mirnv2c of that set (e020-fresh-v2live.toml) are the paired baselines, never run with these arms before. 1v1 against the competitor's planner `live-v2` on clb-left, clb-right.
# 100 games per arena and arm from seed 6001, `after_ticks = 250`. Arms: docs/research/e025/gen_configs.py (`screenB --seed 6001 --games 100 --arms mirlive,liveW-mirlive,fly,liveW,hold --arenas clb-left,clb-right --opp live-v2`).
#   ddnet-ai arena run --config configs/arena/e025-screenB.toml --out ~/aiddnet/data/runs/E-025/screenB --threads 3
name = "E-025: screenB"
base_seed = 6001
games = 100

[rules]
after_ticks = 250

[[condition]]
name = "clb-left: mirlive vs v2live"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, hybrid = { mirror_preset = "live-v2" } }, { brain = "planner", mode = "fixed", preset = "live-v2" }]

[[condition]]
name = "clb-left: liveW-mirlive vs v2live"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, hybrid = { launch_exposure = 1.5, jumpless_hazard_cost = 0.4, mirror_preset = "live-v2" } }, { brain = "planner", mode = "fixed", preset = "live-v2" }]

[[condition]]
name = "clb-left: fly vs v2live"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, hybrid = { proposer = "fly", fly_model = "~/aiddnet/data/runs/E-005/e005-fly/checkpoints/final.bundle" } }, { brain = "planner", mode = "fixed", preset = "live-v2" }]

[[condition]]
name = "clb-left: liveW vs v2live"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, hybrid = { launch_exposure = 1.5, jumpless_hazard_cost = 0.4 } }, { brain = "planner", mode = "fixed", preset = "live-v2" }]

[[condition]]
name = "clb-left: hold vs v2live"
arena = "clb-left"
rules = { hold_target = true }
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0 }, { brain = "planner", mode = "fixed", preset = "live-v2" }]

[[condition]]
name = "clb-right: mirlive vs v2live"
arena = "clb-right"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, hybrid = { mirror_preset = "live-v2" } }, { brain = "planner", mode = "fixed", preset = "live-v2" }]

[[condition]]
name = "clb-right: liveW-mirlive vs v2live"
arena = "clb-right"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, hybrid = { launch_exposure = 1.5, jumpless_hazard_cost = 0.4, mirror_preset = "live-v2" } }, { brain = "planner", mode = "fixed", preset = "live-v2" }]

[[condition]]
name = "clb-right: fly vs v2live"
arena = "clb-right"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, hybrid = { proposer = "fly", fly_model = "~/aiddnet/data/runs/E-005/e005-fly/checkpoints/final.bundle" } }, { brain = "planner", mode = "fixed", preset = "live-v2" }]

[[condition]]
name = "clb-right: liveW vs v2live"
arena = "clb-right"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, hybrid = { launch_exposure = 1.5, jumpless_hazard_cost = 0.4 } }, { brain = "planner", mode = "fixed", preset = "live-v2" }]

