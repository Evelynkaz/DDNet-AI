# work-clock: default-rate
# Task 3.15 (E-028): the arena evaluation of the lag-window model. Joni duel, our hybrid (main defaults, 4 ms of WORK) against live-v2; arm "m1".
#   ddnet-ai arena run --config configs/arena/e028-eval-m1-b.toml --out ~/aiddnet/data/runs/E-028/m1-b --threads 3
name = "e028-eval-m1-b"
base_seed = 13001
games = 200

[[condition]]
name = "m1 lag 3/0"
arena = "joni-duel"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, lag = 3, hybrid = { window_model = "~/aiddnet/data/runs/E-028/m1.oppnet" } }, { brain = "planner", mode = "fixed", preset = "live-v2", lag = 0 }]

