# E-003, part 1: strength of the hybrid brain (task 3.5, D-041/D-042/D-043), >= 200 games per
# condition (docs/EXPERIMENTS.md E-003). "hybrid 4 ms" = HybridBrain, NoProposer, deadline 4 ms, no
# adaptive extension; "adaptive" = the same with the D-042 extension (up to 15 ms in danger);
# "fixed" = the deterministic fixed-work mode. The deadline is counted on the WORK clock (tee-ticks
# x 2.2 us, `clock = "work", step_ms = 0.0022`): the arena VM is shared and loaded (load average 10-27 during the
# runs), a wall deadline there gives a different, weaker search on every run; the work clock makes
# the deadline mode reproducible. Wall-clock conditions ("wall") are kept as a real-time check.
# Train arena clb-left; holdout arenas clb-right and chillblock5-ruler. The planner-only baselines
# (4 ms vs scripted, fixed vs fixed, ...) are E-002's.
# Run: ddnet-ai arena run --config configs/arena/e003-strength.toml --out ~/aiddnet/data/runs/E-003/strength --threads 6
name = "E-003 strength"
base_seed = 1
games = 200

# --- train arena: clb-left ---

[[condition]]
name = "clb-left hybrid 4ms vs scripted"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { adaptive = false } }, { brain = "scripted" }]

[[condition]]
name = "clb-left hybrid 4ms vs planner fixed"
arena = "clb-left"
games = 400
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { adaptive = false } }, { brain = "planner", mode = "fixed" }]

[[condition]]
name = "clb-left hybrid adaptive vs scripted"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0 }, { brain = "scripted" }]

[[condition]]
name = "clb-left hybrid adaptive vs planner fixed"
arena = "clb-left"
games = 400
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0 }, { brain = "planner", mode = "fixed" }]

[[condition]]
name = "clb-left hybrid adaptive vs hybrid 4ms"
arena = "clb-left"
games = 400
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0 }, { brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0, hybrid = { adaptive = false } }]

[[condition]]
name = "clb-left hybrid fixed vs scripted"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "fixed" }, { brain = "scripted" }]

[[condition]]
name = "clb-left hybrid fixed vs planner fixed"
arena = "clb-left"
games = 400
players = [{ brain = "hybrid", mode = "fixed" }, { brain = "planner", mode = "fixed" }]

