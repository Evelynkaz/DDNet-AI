# work-clock: default-rate
# Task 3.6 (D-076, E-010): OLD = the 2.2 us work clock of E-003/E-007 (pinned), NEW = the default `WORK_US_PER_TEE_TICK` (1.25 us),
# same seeds and layouts, so games pair up for McNemar.
#   ddnet-ai arena run --config configs/arena/e010-crowd.toml --out ~/aiddnet/data/runs/E-010/crowd --threads 3
name = "E-010: crowds, old vs new work-clock calibration"
base_seed = 900
games = 200

[rules]
crowd_from = 2
crowd_spacing = 1.0

[[condition]]
name = "8 tees idle bystanders: hybrid 4 ms OLD"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", step_ms = 0.0022, budget_ms = 4.0 }, { brain = "scripted" }, { brain = "idle", count = 6 }]

[[condition]]
name = "8 tees idle bystanders: hybrid 4 ms NEW"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0 }, { brain = "scripted" }, { brain = "idle", count = 6 }]

