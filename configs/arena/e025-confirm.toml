# work-clock: default-rate
# Task 3.13 (E-025): confirmation of hybrid-fly (the E-005 bundle of production) on game indices 100..249 of the E-020 fresh set (seeds 6101..6250: disjoint from the screen 6001..6100, never run with fly); the paired baseline is the stored arm main of e020-fresh-v2live.toml. 1v1 against the competitor's planner `live-v2` on clb-left, clb-right.
# 150 games per arena and arm from seed 6101, `after_ticks = 250`. Arms: docs/research/e025/gen_configs.py (`confirm --seed 6101 --games 150 --arms fly --arenas clb-left,clb-right --opp live-v2`).
#   ddnet-ai arena run --config configs/arena/e025-confirm.toml --out ~/aiddnet/data/runs/E-025/confirm --threads 3
name = "E-025: confirm"
base_seed = 6101
games = 150

[rules]
after_ticks = 250

[[condition]]
name = "clb-left: fly vs v2live"
arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, hybrid = { proposer = "fly", fly_model = "~/aiddnet/data/runs/E-005/e005-fly/checkpoints/final.bundle" } }, { brain = "planner", mode = "fixed", preset = "live-v2" }]

[[condition]]
name = "clb-right: fly vs v2live"
arena = "clb-right"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, hybrid = { proposer = "fly", fly_model = "~/aiddnet/data/runs/E-005/e005-fly/checkpoints/final.bundle" } }, { brain = "planner", mode = "fixed", preset = "live-v2" }]
