# work-clock: default-rate
# Post-mortem of the 2026-10-08 duel against a human (docs/research/duel-2026-10-08-human.md): can the live-like hybrid block an IDLE (AFK) tee
# in today's box? Our hybrid as live (`--finish full` = frozen_drag_weight 20, lag 2, live view, F-DDrace round rules) against `idle`, at the
# starved live-like work clock (2.1 us per tee-tick) and at the arena default (1.25 us).
#   cargo run --release -p ddai-env --example duel_stats -- --config configs/arena/pm1008-afk.toml --threads 3
name = "pm1008: hybrid vs an idle tee in today's box"
base_seed = 33001
games = 40

[[condition]]
name = "afk 2.1us"
arena = "pm1007-clb-duel"
duel = { live_view = [0] }
rules = { max_ticks = 3000 }
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, step_ms = 0.0021, lag = 2, hybrid = { frozen_drag_weight = 20.0 } }, { brain = "idle" }]

[[condition]]
name = "afk 1.25us"
arena = "pm1007-clb-duel"
duel = { live_view = [0] }
rules = { max_ticks = 3000 }
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, lag = 2, hybrid = { frozen_drag_weight = 20.0 } }, { brain = "idle" }]

# The same with the opponent model (`mirror`) off: the hybrid plans against "the idle tee holds", which is what a starved live decision gets
# when the mirror's share of the budget runs out (see the doc, §AFK).
[[condition]]
name = "afk 2.1us no-mirror"
arena = "pm1007-clb-duel"
duel = { live_view = [0] }
rules = { max_ticks = 3000 }
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, step_ms = 0.0021, lag = 2, hybrid = { frozen_drag_weight = 20.0, mirror = false } }, { brain = "idle" }]

