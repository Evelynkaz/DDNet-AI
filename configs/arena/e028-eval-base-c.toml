# work-clock: default-rate
# Task 3.15 (E-028): the arena evaluation of the lag-window model. Joni duel, our hybrid (main defaults, 4 ms of WORK) against live-v2; arm "base".
#   ddnet-ai arena run --config configs/arena/e028-eval-base-c.toml --out ~/aiddnet/data/runs/E-028/base-c --threads 3
name = "e028-eval-base-c"
base_seed = 14001
games = 200

[[condition]]
name = "base lag 3/0"
arena = "joni-duel"
