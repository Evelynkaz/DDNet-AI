arena = "clb-left"
players = [{ brain = "hybrid", mode = "deadline", clock = "work", budget_ms = 4.0, hybrid = { hook_exact_gate = true, hook_snap_aim = true } }, { brain = "planner", mode = "fixed", preset = "normal-v2" }]

