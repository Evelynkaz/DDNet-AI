# Pinned manifest for the MaleCNS v1.0 connectome "minimal file set" (see
# docs/research/fly-data.md §6.1 and docs/FLY.md §2). Read and written by
# `crates/ddai-connectome` (`ddai-connectome fetch` / `--update-sha256`).
#
# Each entry pins:
#   - url          : object URL without a query string; `fetch` requests `url?generation=N`
#   - generation    : GCS object generation (from HEAD's `x-goog-generation`); a wrong/rotated
#                      generation makes GCS answer 404 instead of silently serving new bytes
#   - size          : expected object size in bytes (HEAD `content-length`)
#   - md5           : expected MD5 (hex), decoded from HEAD's `x-goog-hash: md5=<base64>`
#   - sha256        : expected SHA-256 (hex) of the downloaded bytes, checked after every
#                      download; empty string "" means "not pinned yet" — `fetch
#                      --update-sha256` fills it in the first time this entry is downloaded and
#                      verified, and refuses to overwrite a non-empty value
#   - license       : data license (attribution required, see NOTICE)
#   - source_version: dataset release this file was pinned from
#   - citation      : how to cite the dataset (verified against Crossref for
#                      10.1016/j.cell.2026.08.015 on 2026-09-27: Cell 189(18):5504-5526.e15)
